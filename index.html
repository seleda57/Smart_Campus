<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Campus Ala-Too</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F3EEE5; --card:#FFFFFF; --ink:#16213E; --mut:#6B7280; --line:#ECE6DA;
  --blue:#1F3FA6; --blue-soft:#E6EBFA;
  --g:#BFE5CD; --gs:#3E9B66; --y:#F6E2A3; --ys:#C9A02E; --r:#F4B6B0; --rs:#D2574D;
  --room:#FBF9F4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12151F; --card:#1B2030; --ink:#EEF1FA; --mut:#9AA3B8; --line:#2A3046;
    --blue:#8FA8FF; --blue-soft:#232C52; --room:#171B28;
    --g:#2E5A44; --y:#5E5026; --r:#6A3430;
  }
}
*{box-sizing:border-box;margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Manrope,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:420px;padding:20px 16px 28px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hello small{color:var(--mut);font-weight:600;font-size:12px}
h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
h1 span{color:var(--blue)}
.live{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:7px 12px;font-size:12px;font-weight:700;box-shadow:0 1px 0 var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gs);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.35}}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 6px 24px rgba(22,33,62,.06);margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;font:inherit;font-weight:700;font-size:13px;color:var(--mut);padding:7px 14px;border-radius:11px;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.legend{display:flex;gap:12px;margin-top:12px;font-size:11px;font-weight:600;color:var(--mut);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:5px;vertical-align:-1px}
svg{width:100%;height:auto;display:block;margin-top:12px}
.zone{cursor:pointer;transition:.3s}
.zone rect{transition:fill .4s, stroke-width .2s}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:800}
.pill.g{background:var(--g);color:#1d5a38}.pill.y{background:var(--y);color:#6d5410}.pill.r{background:var(--r);color:#8a2b24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill{color:#fff!important}}
.sub{color:var(--mut);font-size:12px;font-weight:600;margin-top:3px}
h2{font-size:18px;font-weight:800;letter-spacing:-.3px}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.m{background:var(--bg);border-radius:18px;padding:12px 10px}
.m b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:6px}
.m b small{font-size:11px;font-weight:700;color:var(--mut)}
.m span{font-size:11px;font-weight:700;color:var(--mut)}
.bar{height:5px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.bar div{height:100%;border-radius:9px;background:var(--blue);transition:width .6s}
.privacy{display:flex;gap:10px;align-items:flex-start;background:var(--blue-soft);color:var(--blue);border-radius:16px;padding:10px 12px;font-size:11.5px;font-weight:600;line-height:1.4;margin-top:14px}
.privacy svg{width:18px;height:18px;flex:none;margin:0}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.sw{width:38px;height:38px;border-radius:13px;flex:none}
.item .t{flex:1}.item .t b{font-size:14px;font-weight:800;display:block}.item .t span{font-size:12px;color:var(--mut);font-weight:600}
.item .n{font-weight:800;font-size:13px;color:var(--blue)}
.btn{width:100%;border:0;background:var(--blue);color:#fff;font:inherit;font-weight:800;padding:14px;border-radius:16px;margin-top:14px;cursor:pointer}
.nav{display:flex;justify-content:space-around;background:var(--card);border-radius:22px;padding:10px;box-shadow:0 6px 24px rgba(22,33,62,.06)}
.nav div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mut)}
.nav .a{color:var(--blue)}
.nav svg{width:22px;height:22px;margin:0}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hello"><small>Ala-Too International University</small><h1>Smart Campus <span>Ala-Too</span></h1></div>
    <div class="live"><i class="dot"></i>Live</div>
  </header>

  <section class="card">
    <div class="row">
      <h2>Campus map</h2>
      <div class="seg" id="floors"><button data-f="1">Floor 1</button><button data-f="2" class="on">Floor 2</button></div>
    </div>
    <svg id="map" viewBox="0 0 340 330" role="img" aria-label="Floor plan"></svg>
    <div class="legend">
      <span><i style="background:var(--g)"></i>Quiet · &gt;3 spots</span>
      <span><i style="background:var(--y)"></i>Moderate</span>
      <span><i style="background:var(--r)"></i>Crowded / noisy</span>
    </div>
  </section>

  <section class="card" id="detail"></section>

  <section class="card">
    <h2 style="margin-bottom:6px">Best spots right now</h2>
    <div id="list"></div>
  </section>

  <nav class="nav">
    <div class="a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Map</div>
    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.700-7 11-7 11z"/><circle cx="12" cy="10" r="2.500"/></svg>Saved</div>
    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Book</div>
    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profile</div>
  </nav>
</div>

<script>
var Z=[
 {id:'lib',f:2,name:'Library 2nd Floor',r:[10,10,320,140],free:6,total:14,db:42,out:14,outT:14},
 {id:'read',f:2,name:'Reading Hall',r:[10,162,150,158],free:2,total:12,db:51,out:8,outT:10},
 {id:'it',f:2,name:'IT Coworking Zone',r:[170,162,160,158],free:1,total:10,db:63,out:9,outT:10},
 {id:'caf',f:1,name:'Cafeteria Lounge',r:[10,10,320,140],free:0,total:20,db:68,out:6,outT:8},
 {id:'grp',f:1,name:'Group Study Rooms',r:[10,162,150,158],free:4,total:8,db:46,out:8,outT:8},
 {id:'hub',f:1,name:'Lobby Study Hub',r:[170,162,160,158],free:3,total:9,db:55,out:7,outT:9}
];
var floor=2, sel='lib';
function st(z){ if(z.free===0||z.db>=60)return 'r'; if(z.free>3&&z.db<50)return 'g'; return 'y'; }
var lab={g:'Quiet · Plenty of space',y:'Moderate · Limited',r:'Crowded · Noisy'};
var fill={g:'var(--g)',y:'var(--y)',r:'var(--r)'};
var strk={g:'var(--gs)',y:'var(--ys)',r:'var(--rs)'};
function byId(i){return Z.filter(function(z){return z.id===i})[0]}
function dbWord(d){return d<45?'Quiet':d<58?'Moderate':'Loud'}
function drawMap(){
  var h='<rect x="2" y="2" width="336" height="326" rx="22" fill="none" stroke="var(--line)" stroke-width="2"/>';
  Z.filter(function(z){return z.f===floor}).forEach(function(z){
    var s=st(z),r=z.r,on=z.id===sel;
    h+='<g class="zone" onclick="pick(\''+z.id+'\')"><rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" rx="18" fill="'+fill[s]+'" stroke="'+(on?'var(--blue)':strk[s])+'" stroke-width="'+(on?3.5:1.2)+'"/>'
     +'<text x="'+(r[0]+14)+'" y="'+(r[1]+26)+'" font-size="12.5" font-weight="800" fill="var(--ink)">'+z.name+'</text>'
     +'<text x="'+(r[0]+14)+'" y="'+(r[1]+r[3]-14)+'" font-size="11" font-weight="700" fill="var(--ink)" opacity=".75">'+z.free+' free · '+Math.round(z.db)+' dB</text>';
    // little table dots
    for(var i=0;i<Math.min(z.total,10);i++){
      var cx=r[0]+r[2]-22-(i%5)*18, cy=r[1]+(i<5?r[3]/2-10:r[3]/2+10);
      h+='<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="'+(i<z.free?'var(--card)':'var(--ink)')+'" opacity="'+(i<z.free?1:.28)+'"/>';
    }
    h+='</g>';
  });
  h+='<text x="170" y="157" font-size="9" font-weight="700" fill="var(--mut)" text-anchor="middle">CORRIDOR</text>';
  document.getElementById('map').innerHTML=h;
}
function drawDetail(){
  var z=byId(sel),s=st(z),pct=Math.min(100,Math.max(0,(z.db-30)/50*100));
  var oOk=z.out===z.outT;
  document.getElementById('detail').innerHTML=
   '<div class="row"><div><h2>'+z.name+'</h2><div class="sub">Floor '+z.f+' · updated just now</div></div><span class="pill '+s+'">'+lab[s].split(' · ')[0]+'</span></div>'
  +'<div class="metrics">'
  +'<div class="m"><span>Noise</span><b>'+Math.round(z.db)+' <small>dB</small></b><div class="bar"><div style="width:'+pct+'%"></div></div><div class="sub">'+dbWord(z.db)+'</div></div>'
  +'<div class="m"><span>Seating</span><b>'+z.free+' <small>free</small></b><div class="bar"><div style="width:'+(z.free/z.total*100)+'%"></div></div><div class="sub">of '+z.total+' tables</div></div>'
  +'<div class="m"><span>Outlets</span><b style="font-size:16px;margin-top:10px">'+(oOk?'All working':z.out+'/'+z.outT)+'</b><div class="bar"><div style="width:'+(z.out/z.outT*100)+'%"></div></div><div class="sub">'+(oOk?'Ready to charge':(z.outT-z.out)+' out of order')+'</div></div>'
  +'</div>'
  +'<div class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.500 3 8 7 10 4-2 7-5.500 7-10V6l-7-3z"/><path d="m9 12 2 2 4-4"/></svg><span>Camera AI active: Anonymous occupancy tracking only (No video recorded)</span></div>'
  +'<button class="btn" onclick="this.textContent=\'Route to '+z.name+' ✓\'">Navigate here</button>';
}
function drawList(){
  var rank={g:0,y:1,r:2};
  var a=Z.slice().sort(function(x,y){return rank[st(x)]-rank[st(y)]||y.free-x.free}).slice(0,4);
  document.getElementById('list').innerHTML=a.map(function(z){var s=st(z);
    return '<div class="item" onclick="pick(\''+z.id+'\',true)"><div class="sw" style="background:'+fill[s]+'"></div><div class="t"><b>'+z.name+'</b><span>Floor '+z.f+' · '+Math.round(z.db)+' dB · outlets '+z.out+'/'+z.outT+'</span></div><div class="n">'+z.free+' free</div></div>';
  }).join('');
}
function pick(i,sw){var z=byId(i);sel=i;if(sw&&z.f!==floor)setFloor(z.f);render();}
function setFloor(f){floor=f;[].forEach.call(document.querySelectorAll('#floors button'),function(b){b.classList.toggle('on',+b.dataset.f===f)});
  if(byId(sel).f!==f)sel=Z.filter(function(z){return z.f===f})[0].id;}
function render(){drawMap();drawDetail();drawList();}
document.getElementById('floors').onclick=function(e){var b=e.target.closest('button');if(b){setFloor(+b.dataset.f);render();}};
setInterval(function(){
  Z.forEach(function(z){
    z.db=Math.max(34,Math.min(72,z.db+(Math.random()*4-2)));
    if(Math.random()<.2)z.free=Math.max(0,Math.min(z.total,z.free+(Math.random()<.5?-1:1)));
  });render();
},3000);
render();
</script>
</body>
</html>
